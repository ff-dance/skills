interface:
  display_name: "Siemens Slides"
  short_description: "Generate Siemens Advanta-style consulting slide images"
  brand_color: "#009999"
  default_prompt: "Use $siemens-slides to generate a Siemens Advanta-style raster slide image. Execute in PDCA order. Plan: treat the template only as a brand source, not as a layout source; first determine the page question, then choose the reasoning pattern, then extract the Action Title and key evidence, and only after that map the reasoning pattern to the closest layout. Keep one primary page question per page, make the title a full conclusion sentence, and ensure the page is evidence-backed with at least one L2 hero proof anchor such as a hero number, comparison block, chart-like evidence area, process evidence, or priority structure. If the input contains multiple page questions, recommend splitting first; if the user still wants one page, mark it as a compressed single-page view and prefer a structured overview pattern rather than forcing a template shape. Do: build the prompt with L1-L5 information hierarchy, brand token boundaries, footer geometry, semantic colors, icon color semantics, and component strategy. If the page depends on arrows, nodes, labels, icons, or flow components, read references/components-cheatsheet.md first and references/components.md only when you need deeper semantic guidance. Use layout only as the visual carrier of the reasoning pattern, and allow restrained creativity inside the grid through local asymmetry, mini-processes, relationship chains, or one signature evidence area. Never expose internal method words such as MECE, reasoning pattern, or layout type in the final page copy unless the user explicitly asks for them. Enforce the Advanta content-page footer family using the extracted ordinary-content-page geometry: page zone 411162/6310800/648000/547200 EMU at about x 3.37%, footer text zone 1059160/6310800/8640003/547200 EMU at about x 8.69% beginning exactly flush to the right edge of the page number on the same baseline, and compact SIEMENS brand zone 10635188/6418800/1152000/183168 EMU at about x 87.23%, y 93.60%, width 9.45%, all inside the footer band and never overlapped by the takeaway strip or body content. The footer text band must not be center-aligned, must not float as a centered bottom caption, and its optical center must stay clearly left of the slide midpoint. Do not use the larger cover-style or divider-style logo family on ordinary content pages; reserve the large logo family around 10274400/6364800/1512000/240408 EMU for cover, chapter divider, or similarly special page types only. On light content pages, keep title and body Deep Blue, use one dominant hero accent color by default Siemens Petrol, use Light Petrol only for process or connector support, Advanta Green only for positive recommendation accents, and Orange only for controlled risk callouts. On light content pages, default functional and business icons should use Deep Blue, process or connector icons may use Light Petrol only when they express flow, and risk icons may use Orange only when they express warning. On light content pages, the bottom-right `SIEMENS` brand mark must use Siemens Petrol #009999, not an approximate teal. Ensure the page reads like a ghost deck and avoids dead text walls across all reasoning patterns by giving at least one primary content area structured visual rhythm through icons, nodes, mini-processes, or relationship structures. Generate the final slide image directly with image generation; do not use Python, PIL/Pillow, matplotlib, Plotly, SVG/HTML/canvas screenshots, or script drawing as the final image-generation path. Use sharp-corner rectangles, a single-color takeaway strip when the page needs closure, and generate a corporate consulting presentation slide, not a poster. Check: reopen the image and validate it against the quality checklist. Act: if footer, color, reasoning pattern, evidence anchor, closure, or readability fail, rewrite the prompt and regenerate once; if the second attempt still fails, deliver the best approximation plus a structured slide brief with Action Title, reasoning pattern, preferred layout, L1-L5 text, component strategy, and known issues."
