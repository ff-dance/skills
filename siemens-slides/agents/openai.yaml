interface:
  display_name: "Siemens Slides"
  short_description: "生成中文 Siemens Advanta 风格咨询页图片"
  brand_color: "#009999"
  default_prompt: "使用 $siemens-slides 生成中文 Siemens Advanta 风格咨询页图片。先形成一个中文 `slide_spec`：只回答一个 `page_question`，包含结论句式 `Action Title`、一个明确 `reasoning_pattern`、一个 L2 hero 证据锚点、合法的 content-page footer family、合法的色彩策略，并在最终页面规划中保留清晰的 L5 takeaway；再把 layout 当作论证模式的承载结果，按需读取 references，用图像生成产出最终图片，并按质量清单回看。若 P0 在一次重试后仍失败，则降级为 image-plus-brief。"
