interface:
  display_name: "Siemens Slides"
  short_description: "Generate Siemens Advanta-style slide images"
  brand_color: "#009999"
  default_prompt: "Use $siemens-slides to follow the Siemens Advanta design system. Default to Chinese unless the user explicitly asks for English. Read references/style-guide.md first to lock system-level style, then read references/layouts.md to choose the closest layout and reference slide. If the page depends on arrows, nodes, labels, icons, or flow components, read references/components-cheatsheet.md first and references/components.md only when you need deeper source context. Treat local reference paths as agent-only lookup material: inspect them and summarize the observed layout or component traits instead of assuming the image model can read disk paths. Generate the final slide image with image generation directly; do not use Python, PIL/Pillow, matplotlib, Plotly, SVG/HTML/canvas screenshots, or script drawing as the final image-generation path. Use sharp-corner rectangles, square or rectangular number badges, no default dashed text boxes, and a single-color bottom takeaway strip when a bottom summary area is needed. Generate a corporate presentation slide, not a poster, and keep the bottom-left page area, footer zone, and bottom-right SIEMENS brand area visually stable and readable."
